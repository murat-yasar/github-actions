name: Cache Node and NPM Dependencies
description: This action allows to cache both Node and NPM dependencies based on the package-lock.json file.

inputs:
  node_version:
    description: NodeJS version to use
    default: 20.x
    required: true
  working_directory:
    description: The working directory of the application
    default: .
    required: false

runs:
  using: composite
  steps:
    - name: Setup NodeJS version ${{inputs.node_version}}
      uses: actions/setup-node@v3
      with:
        node-version: ${{inputs.node_version}}
    - name: Cache Dependencies
      id: cache
      uses: actions/cache@v3
      with:
        path: ${{inputs.working_directory}}/node_modules
        key: node-modules-${{ hashFiles('${{ inputs.working_directory }}/package-lock.json') }}
    - name: Install Dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
      working-directory: ${{inputs.working_directory}}