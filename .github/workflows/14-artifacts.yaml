name: 14 - Artifacts

on:
  workflow_dispatch:

env:
  build-artifact-key: app-${{github.sha}}
  test-coverage-key: test-coverage-${{github.sha}}

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: Download cached dependencies
        uses: actions/cache@v3
        id: cache
        with:
          path: apps/react-app/node_modules
          key: deps-node-modules-${{hashFiles('apps/react-app/package-lock.json')}}
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Test
        run: npm run test -- --coverage
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.test-coverage-key}}
          path: apps/react-app/coverage
      - name: Build code
        run: npm run build
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.build-artifact-key}}
          path: apps/react-app/build

  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          name: ${{env.build-artifact-key}}
          path: apps/react-app/build
      - name: Show folder structure
        run: ls -R