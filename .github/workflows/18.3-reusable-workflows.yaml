name: 18.3 - Reusable Workflows | usage from another repo

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/18.1-reusable-workflows.yaml
    with:
      target-directory: dummy-dir

  e2e-test:
    # uses: <owner>/<repo>/.github/workflows/<workflow_name>@<version>
    uses: murat-yasar/github-actions-e2e-tests/.github/workflows/e2e.yaml@main
    needs: deploy
    secrets:
      access-token: ${{ secrets.GH_PAT_GH_ACTIONS_E2E_TESTS }}
