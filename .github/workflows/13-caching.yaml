name: 13 - Caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: Whether to execute the cache step
        type: boolean
        default: true
      node-version:
        description: Node versions
        type: choice
        options:
          - 19.x
          - 20.x
          - 21.x
        default: 20.x

# 1. Checkout the code
# 2. Install dependencies
# 3. Lint, Format, Test, Build
# 4. Deploy to the nonprod environment

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "apps/react-app"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: " ${{ inputs.node-version }} "
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Deploy
        run: echo "Deploying to nonprod..."
