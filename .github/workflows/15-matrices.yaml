name: 15 - matrices

on:
  workflow_dispatch:

jobs:
  backwards-compatibility:
    name: ${{matrix.os}}-${{matrix.node-version}}
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        node-version: [19.x, 20.x, 21.x]
        os:
          - ubuntu-latest
          # - macos-latest
          - windows-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{matrix.node-version}}
      - name: Testing
        run: echo "Running tests on ${{matrix.os}} with NodeJS ${{matrix.node-version}}"