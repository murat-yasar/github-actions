name: 10 - Execution Flow

on:
  workflow_dispatch:
    inputs:
      pass-unit-tests:
        type: boolean
        description: Whether unit tests will pass or not
        default: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Lint and Build
        run: |
          echo "Linting and Building project"
          # npm run lint
          # npm run format:check
          # npm run tsc:check
          # npm run build

  unit-tests:
    runs-on: ubuntu-latest
    continue-on-error: true   # Lets skipping this job and move on to the following jobs, in case of error
    steps:
      - name: Running unit tests
        run: echo "Running unit tests..."

      # Runs only, if earlier step fails
      - name: Failing tests
        if: ${{ !inputs.pass-unit-tests }}
        run: exit 1

  # Runs only if lint-build and unit-tests are successfully completed
  deploy-nonprod:
    runs-on: ubuntu-latest
    needs:
      - lint-build
      - unit-tests
    steps:
      - name: Deploying to nonprod
        run: echo "Deploying to nonprod..."

  # Runs only, if deploy-nonprod is successfully completed
  e2e-tests:
    runs-on: ubuntu-latest
    needs:
      - deploy-nonprod
    steps:
      - name: Running E2E tests
        run: echo "Running E2E tests..."

  # Runs only, if deploy-nonprod is successfully completed
  load-tests:
    runs-on: ubuntu-latest
    needs:
      - deploy-nonprod
    steps:
      - name: Running load-tests
        run: echo "Running load-tests..."

  # Runs only, if e2e and load tests are successfully completed
  deploy-prod:
    runs-on: ubuntu-latest
    needs:
      - e2e-tests
      - load-tests
    steps:
      - name: Deploying to prod
        run: echo "Deploying to prod..."