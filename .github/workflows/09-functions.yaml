name: 09 - functions

on:
  pull_request:
  workflow_dispatch:

jobs:
  echo1:
    runs-on: ubuntu-latest
    steps:
      - name: Print PR title
        run: |
          echo "PR title: ${{ github.event.pull_request.name }}"
      - name: Print PR labels
        run: |
          cat << EOF
          ${{ github.event.pull_request.labels }}
          EOF
      - name: Bug-fix
        if: ${{ !cancelled() && contains(github.event.pull_request.title, 'fix') }}
        run: "This is a bug-fix"
      - name: Sleep 10 second
        run: sleep 10
      - name: Run (exit-1)
        run: exit 1
      - name: Test (success)
        if: ${{ success() }}
        run: echo "Previous step is successfull!"
      - name: Test (success)
        if: ${{ !success() }}
        run: echo "Previous step is NOT successfull!"
      - name: Test (fail)
        if: ${{ failure() }}
        run: echo "At least one of the previous steps has been failed!"
      - name: Test (cancel)
        if: ${{ cancelled() }}
        run: echo "The workflow has been canceled!"
      - name: Test (not-canceled)
        if: ${{ !cancelled() }}
        run: echo "The workflow has NOT been canceled!"
